[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.1.13"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.13.0",
    "flwr-datasets[vision]>=0.3.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "wandb>=0.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10     # Increased from 3 to allow more global aggregation cycles
fraction-evaluate = 1.0
local-epochs = 3           # Increased from 1 so clients train longer locally per round
learning-rate = 0.01       # Adjusted down slightly from 0.1 for more stable convergence
batch-size = 32
save-model = false